<!DOCTYPE html>
<html lang="zh-CN" data-theme="midnight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>DNS 切换 · cf-failover</title>
<style>
/* ---------------------------------------------------------------------- */
/* 主题变量                                                                */
/* ---------------------------------------------------------------------- */
:root,
[data-theme="midnight"]{
  --bg:#0a0e15; --bg-grad1:rgba(56,189,248,.07); --bg-grad2:rgba(167,139,250,.06);
  --panel:rgba(255,255,255,.032); --panel-2:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.08); --line-soft:rgba(255,255,255,.05);
  --txt:#e9eff8; --dim:#93a2b8; --dim2:#5f6d82;
  --accent:#38bdf8; --ok:#34d399; --warn:#fbbf24; --bad:#fb7185; --vio:#a78bfa;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}
[data-theme="slate"]{
  --bg:#0f141a; --bg-grad1:rgba(148,163,184,.06); --bg-grad2:rgba(56,189,248,.05);
  --panel:rgba(255,255,255,.04); --panel-2:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.09); --line-soft:rgba(255,255,255,.055);
  --txt:#e6ecf3; --dim:#9aa8ba; --dim2:#6b7889;
  --accent:#7dd3fc; --ok:#4ade80; --warn:#facc15; --bad:#f87171; --vio:#c4b5fd;
  --shadow:0 10px 30px rgba(0,0,0,.3);
}
[data-theme="day"]{
  --bg:#f4f6fa; --bg-grad1:rgba(14,165,233,.08); --bg-grad2:rgba(139,92,246,.07);
  --panel:#ffffff; --panel-2:#f6f8fc;
  --line:rgba(15,23,42,.09); --line-soft:rgba(15,23,42,.06);
  --txt:#101827; --dim:#5c6a7e; --dim2:#8a97a8;
  --accent:#0284c7; --ok:#059669; --warn:#b45309; --bad:#dc2626; --vio:#7c3aed;
  --shadow:0 8px 24px rgba(15,23,42,.08);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--txt); min-height:100vh;
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(1100px 520px at 12% -8%, var(--bg-grad1), transparent 62%),
    radial-gradient(900px 480px at 92% 4%, var(--bg-grad2), transparent 60%);
  background-attachment:fixed;
}
.mono{font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;font-variant-numeric:tabular-nums}

/* ---------------------------------------------------------------------- */
/* 顶栏                                                                    */
/* ---------------------------------------------------------------------- */
header{
  position:sticky; top:0; z-index:30;
  background:var(--bg); border-bottom:1px solid var(--line-soft);
  padding:12px 22px; display:flex; align-items:center; gap:14px;
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  background:linear-gradient(150deg,var(--accent),var(--vio));box-shadow:0 4px 14px rgba(56,189,248,.25)}
.logo svg{width:17px;height:17px;stroke:#08111c;stroke-width:2.1;fill:none;stroke-linecap:round;stroke-linejoin:round}
.brand h1{font-size:15px;font-weight:650;margin:0;letter-spacing:.01em;white-space:nowrap}
.brand .sub{font-size:11.5px;color:var(--dim2);margin-left:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}

.pill{display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:999px;
  font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--panel)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--dim2);box-shadow:0 0 0 3px rgba(255,255,255,.04)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 34%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.pill.ok .dot{background:var(--ok);animation:breathe 2.6s ease-in-out infinite}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 34%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.pill.warn .dot{background:var(--warn)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 36%,transparent);background:color-mix(in srgb,var(--bad) 11%,transparent)}
.pill.bad .dot{background:var(--bad);animation:breathe 1.4s ease-in-out infinite}
.pill.vio{color:var(--vio);border-color:color-mix(in srgb,var(--vio) 34%,transparent);background:color-mix(in srgb,var(--vio) 10%,transparent)}
.pill.vio .dot{background:var(--vio)}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.35}}

.ctl{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel);color:var(--dim);font-size:12.5px;cursor:pointer;
  transition:border-color .15s,color .15s,background .15s}
.ctl:hover{color:var(--txt);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.ctl.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 9%,transparent)}
select.ctl{appearance:none;padding-right:22px;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 12px) 13px,calc(100% - 8px) 13px;background-size:4px 4px;background-repeat:no-repeat}
.btn-primary{height:30px;padding:0 13px;border-radius:9px;border:1px solid transparent;cursor:pointer;
  background:linear-gradient(150deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--vio)));
  color:#06121c;font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.btn-primary:hover{filter:brightness(1.06)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed}

/* ---------------------------------------------------------------------- */
/* 布局                                                                    */
/* ---------------------------------------------------------------------- */
main{max-width:1360px;margin:0 auto;padding:18px 22px 44px;display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0;position:relative}
.card.pad0{padding:0}
.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}.c2{grid-column:span 2}
@media(max-width:1080px){.c4,.c3,.c2{grid-column:span 6}}
@media(max-width:640px){main{padding:14px 12px 36px;gap:11px}header{padding:10px 12px;gap:9px}.brand .sub{display:none}}

.card-h{display:flex;align-items:center;gap:9px;margin:0 0 11px}
.card-h h2{font-size:12px;font-weight:650;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:0}
.card-h .cnt{font-size:11.5px;color:var(--dim2);margin-left:auto}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.kpis .kpi{padding:2px 18px;border-left:1px solid var(--line-soft)}
.kpis .kpi:first-child{border-left:0;padding-left:2px}
@media(max-width:1080px){.kpis{grid-template-columns:repeat(2,1fr);gap:16px 0}
  .kpis .kpi:nth-child(3){border-left:0;padding-left:2px}}
@media(max-width:640px){.kpis{grid-template-columns:1fr}
  .kpis .kpi{border-left:0;padding:8px 2px;border-top:1px solid var(--line-soft)}
  .kpis .kpi:first-child{border-top:0}}
.kpi{display:flex;flex-direction:column;gap:5px;min-width:0}
.kpi .lbl{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim2);font-weight:600}
.kpi .val{font-size:23px;font-weight:600;letter-spacing:-.01em;line-height:1.22;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .val.sm{font-size:17px}
.kpi .meta{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:600;
  border:1px solid var(--line);color:var(--dim)}
.tag.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 32%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.tag.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 32%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.tag.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 34%,transparent);background:color-mix(in srgb,var(--bad) 10%,transparent)}
.tag.vio{color:var(--vio);border-color:color-mix(in srgb,var(--vio) 32%,transparent);background:color-mix(in srgb,var(--vio) 10%,transparent)}

/* 节点卡 */
.nodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(232px,1fr));gap:12px}
.node{border:1px solid var(--line);border-radius:12px;padding:12px 13px;background:var(--panel-2);position:relative;overflow:hidden}
.node.primary::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:linear-gradient(var(--accent),transparent)}
.node.down{border-color:color-mix(in srgb,var(--bad) 30%,var(--line))}
.node-top{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.node-name{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank{font-size:10.5px;font-weight:700;color:var(--dim2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.node-ip{font-size:19px;letter-spacing:.01em;margin:2px 0 8px}
.node-row{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:4px}
.node-row b{font-weight:600;color:var(--txt)}
.bar{height:5px;border-radius:3px;background:var(--line-soft);overflow:hidden;margin:9px 0 7px}
.bar i{display:block;height:100%;border-radius:3px;background:var(--ok)}
.bar i.warn{background:var(--warn)}
.bar i.bad{background:var(--bad)}

/* 时间轴 */
.tl-wrap{position:relative}
canvas{display:block;width:100%;height:118px}
.tl-tip{position:absolute;pointer-events:none;z-index:5;background:var(--panel-2);border:1px solid var(--line);
  border-radius:8px;padding:7px 9px;font-size:11.5px;line-height:1.6;box-shadow:var(--shadow);display:none;white-space:nowrap}
.tl-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--dim2);margin-top:8px}
.tl-legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* 事件 */
.card.col{display:flex;flex-direction:column}
.events{display:flex;flex-direction:column;gap:1px;flex:1;min-height:120px;overflow:hidden}
.ev{display:flex;gap:10px;align-items:baseline;padding:7px 2px;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.ev:last-child{border-bottom:0}
.ev time{color:var(--dim2);font-size:11.5px;flex:0 0 92px}
.ev .k{flex:0 0 52px;font-weight:700;font-size:11.5px}
.ev .k.switch{color:var(--vio)}.ev .k.failback{color:var(--ok)}.ev .k.allfail{color:var(--bad)}
.ev .k.readerr{color:var(--bad)}.ev .k.dryrun{color:var(--dim2)}.ev .k.config{color:var(--warn)}
.ev .t{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .arrow{color:var(--dim2);font-size:11px}
.ev-note{margin-top:auto;padding-top:10px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--dim2);line-height:1.7}
.ev-note span{color:var(--dim)}

/* 日志 */
.logbar{display:flex;gap:6px;align-items:center;margin-bottom:9px}
.log{background:color-mix(in srgb,var(--bg) 55%,transparent);border:1px solid var(--line-soft);border-radius:10px;
  padding:9px 11px;max-height:290px;overflow:auto;font-size:11.8px;line-height:1.72}
.log div{display:flex;gap:9px;white-space:pre-wrap;word-break:break-all}
.log time{color:var(--dim2);flex:0 0 auto}
.log .lv{flex:0 0 40px;font-size:10.5px;font-weight:700;letter-spacing:.04em}
.log .lv.ok{color:var(--ok)}.log .lv.warn{color:var(--warn)}.log .lv.error{color:var(--bad)}.log .lv.info{color:var(--dim2)}
.log .m{color:var(--dim);flex:1}
.log div.ok .m{color:color-mix(in srgb,var(--ok) 72%,var(--txt))}
.log div.error .m{color:color-mix(in srgb,var(--bad) 78%,var(--txt))}
.log div.warn .m{color:color-mix(in srgb,var(--warn) 72%,var(--txt))}

/* 配置 */
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:2px 22px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.kv span{color:var(--dim2)}
.kv b{font-weight:500;color:var(--txt);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62%}
.path{font-size:11.5px;color:var(--dim2);word-break:break-all;margin-top:8px;line-height:1.7}

/* 空状态 */
.empty{padding:26px 18px;text-align:center;color:var(--dim)}
.empty h3{font-size:14px;color:var(--txt);margin:0 0 8px}
.empty code{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:5px;padding:1px 6px;font-size:11.5px}

/* 弹层 */
.mask{position:fixed;inset:0;background:rgba(4,8,14,.72);z-index:60;display:none;align-items:center;justify-content:center;padding:22px}
.mask.on{display:flex}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  width:min(760px,100%);max-height:84vh;display:flex;flex-direction:column;overflow:hidden}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--line-soft);display:flex;align-items:center;gap:10px}
.modal-h h3{margin:0;font-size:14px;font-weight:650}
.modal-b{padding:16px 18px;overflow:auto}
.modal-f{padding:12px 18px;border-top:1px solid var(--line-soft);display:flex;gap:9px;justify-content:flex-end}
.out{background:color-mix(in srgb,var(--bg) 60%,#000 8%);border:1px solid var(--line-soft);border-radius:10px;
  padding:11px 13px;font-size:12px;line-height:1.75;white-space:pre-wrap;max-height:44vh;overflow:auto;color:var(--dim)}
.out b{color:var(--txt)}
.hint{font-size:12.5px;color:var(--dim);line-height:1.8}
.hint code{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:5px;padding:1px 6px;font-size:11.5px;color:var(--txt);word-break:break-all}
.warnbox{border:1px solid color-mix(in srgb,var(--warn) 34%,transparent);background:color-mix(in srgb,var(--warn) 9%,transparent);
  border-radius:10px;padding:11px 13px;font-size:12.5px;color:var(--txt);margin-bottom:12px;line-height:1.7}

footer{max-width:1360px;margin:0 auto;padding:0 22px 26px;display:flex;gap:16px;flex-wrap:wrap;
  font-size:11.5px;color:var(--dim2)}
footer b{color:var(--dim);font-weight:500}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M3 12h5l2-6 4 12 2-6h5"/></svg>
    </div>
    <h1>DNS 切换</h1>
    <span class="sub" id="site">cf-failover</span>
  </div>
  <div class="spacer"></div>
  <span class="pill" id="statusPill"><i class="dot"></i><span>载入中</span></span>
  <select class="ctl" id="refresh" title="自动刷新间隔">
    <option value="3">3 秒</option>
    <option value="5">5 秒</option>
    <option value="10">10 秒</option>
    <option value="30">30 秒</option>
    <option value="0">手动</option>
  </select>
  <button class="ctl" id="themeBtn" title="切换配色">配色</button>
  <button class="btn-primary" id="runBtn">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
    立即检测
  </button>
</header>

<main id="main">
  <div class="card c6" id="boot"><div class="empty">正在读取 cf-failover 日志…</div></div>
</main>

<footer>
  <span>cfdash <b id="ver">—</b></span>
  <span>解析耗时 <b id="elapsed">—</b></span>
  <span>集合时间 <b id="genAt">—</b></span>
  <span id="modeNote"></span>
</footer>

<div class="mask" id="runMask">
  <div class="modal">
    <div class="modal-h"><h3 id="runTitle">立即检测</h3></div>
    <div class="modal-b" id="runBody"></div>
    <div class="modal-f" id="runFoot"></div>
  </div>
</div>

<script>
"use strict";

/* ====================================================================== */
/* 基础                                                                    */
/* ====================================================================== */
const BASE = (function(){
  const m = location.pathname.match(/^(\/app\/[^/]+)(?:\/|$)/);
  if (m) return m[1];
  return location.pathname.replace(/\/(?:index\.html)?$/, "");
})();

const S = {
  snap: null,
  etag: "",
  theme: new URLSearchParams(location.search).get("theme") || localStorage.getItem("cfdash.theme") || "midnight",
  refresh: Number(localStorage.getItem("cfdash.refresh") || 5),
  logFilter: "all",
  timer: null,
  busy: false,
  tlHover: -1,
};

const THEMES = ["midnight", "slate", "day"];
const THEME_NAME = { midnight: "极夜", slate: "灰蓝", day: "白昼" };

const $ = (s) => document.querySelector(s);
const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
};
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* 时间工具 */
const pad = (n) => String(n).padStart(2, "0");
function fmtTime(ts){
  if (!ts) return "—";
  const d = new Date(ts * 1000);
  return `${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fmtClock(ts){
  if (!ts) return "—";
  const d = new Date(ts * 1000);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function fmtAgo(ts){
  if (!ts) return "从未";
  const s = Math.max(0, Math.floor(Date.now() / 1000) - ts);
  if (s < 60) return s + " 秒前";
  if (s < 3600) return Math.floor(s / 60) + " 分钟前";
  if (s < 86400) return Math.floor(s / 3600) + " 小时前";
  return Math.floor(s / 86400) + " 天前";
}
function fmtDur(sec){
  if (!sec) return "—";
  if (sec < 60) return sec + " 秒";
  if (sec < 3600) return Math.round(sec / 60) + " 分钟";
  return (sec / 3600).toFixed(1).replace(/\.0$/, "") + " 小时";
}

const RESULT_TEXT = {
  nochange: "无变更", pending: "等待确认", switch: "已切换", failback: "已回切",
  dryrun: "试运行", allfail: "全部不可用", readerr: "读取失败", config: "配置错误",
  error: "执行错误", probe: "探测中", unknown: "未知",
};
const RESULT_COLOR = {
  nochange: "ok", pending: "warn", switch: "vio", failback: "ok", dryrun: "dim",
  allfail: "bad", readerr: "bad", config: "warn", error: "bad",
};

/* ====================================================================== */
/* 取数                                                                    */
/* ====================================================================== */
async function fetchState(force){
  try {
    const r = await fetch(BASE + "/api/state", {
      headers: Object.assign({ "Accept": "application/json" }, S.etag && !force ? { "If-None-Match": S.etag } : {}),
      cache: "no-store",
    });
    if (r.status === 304) return;
    if (!r.ok) throw new Error("HTTP " + r.status);
    S.etag = r.headers.get("ETag") || "";
    S.snap = await r.json();
    render();
  } catch (e) {
    const p = $("#statusPill");
    if (p) p.outerHTML = `<span class="pill bad" id="statusPill"><i class="dot"></i><span>无法连接面板</span></span>`;
  }
}

function schedule(){
  clearInterval(S.timer);
  if (S.refresh > 0) S.timer = setInterval(() => { if (!document.hidden && !S.busy) fetchState(false); }, S.refresh * 1000);
}

/* ====================================================================== */
/* 渲染                                                                    */
/* ====================================================================== */
function render(){
  const s = S.snap;
  if (!s) return;

  const st = s.stats || {};
  const inst = s.install || {};
  const cfg = s.config || {};

  $("#ver").textContent = "v" + (s.version || "—");
  $("#elapsed").textContent = (s.elapsed_ms || 0) + " ms";
  $("#genAt").textContent = fmtClock(s.now);
  $("#modeNote").textContent = inst.mode === "config" ? "配置文件模式" : inst.mode === "inline" ? "内联脚本模式" : "";

  const rec = (cfg.records && cfg.records[0]) || {};
  $("#site").textContent = rec.name ? rec.name : (inst.config_path || "未安装");

  renderStatus();
  renderLayout();
  renderTimeline();
}

function statusOf(s){
  const st = s.stats || {}, inst = s.install || {};
  if (!inst.found) return { cls: "", text: "未检测到安装" };
  const interval = st.interval || 300;
  const age = st.last_ts ? Math.floor(Date.now() / 1000) - st.last_ts : 1e9;
  if (st.last_ts && age > interval * 3 + 120) return { cls: "warn", text: `调度停滞 ${fmtDur(age)}` };
  if (!st.last_ts) return { cls: "warn", text: "暂无检测记录" };
  const r = st.last_result;
  if (r === "allfail") return { cls: "bad", text: "节点全部不可用" };
  if (r === "readerr") return { cls: "bad", text: "无法读取记录" };
  if (r === "switch" || r === "failback") return { cls: "vio", text: RESULT_TEXT[r] };
  if (r === "pending") return { cls: "warn", text: "等待确认" };
  return { cls: "ok", text: "运行正常" };
}

function renderStatus(){
  const s = S.snap;
  const st = statusOf(s);
  const p = $("#statusPill");
  if (!p) return;
  p.className = "pill " + st.cls;
  p.innerHTML = `<i class="dot"></i><span>${esc(st.text)}</span>`;
}

function activeNode(){
  const s = S.snap;
  const rounds = s.rounds || [];
  const last = rounds[rounds.length - 1];
  if (last && last.n) return last.n;
  const st = s.stats || {};
  const hit = (s.nodes || []).find((n) => n.last_ok && n.last_ok === st.last_ts);
  return hit ? hit.host : "";
}

function primaryIsActive(){
  const s = S.snap;
  const host = activeNode();
  const primary = (s.nodes || []).find((n) => n.primary);
  if (!primary || !host) return false;
  if (host === primary.host) return true;
  // 配置里的节点与日志主机名对不上时，退化成比较 IP
  const p = (s.nodes || []).find((n) => n.host === host);
  return !!(p && primary.ip && p.ip === primary.ip);
}

function renderNodes(nodes){
  const box = $("#nodes");
  if (!box) return;
  if (!nodes.length){ box.innerHTML = `<div class="empty">配置里没有节点</div>`; return; }
  box.innerHTML = "";
  nodes.forEach((n) => {
    const down = n.last_fail && n.last_fail > n.last_ok;
    const rate = n.rate || 0;
    const cls = rate >= 99 ? "ok" : rate >= 90 ? "warn" : "bad";
    const node = el("div", "node" + (n.primary ? " primary" : "") + (down ? " down" : ""));
    node.innerHTML = `
      <div class="node-top">
        <span class="rank">#${n.priority}</span>
        <span class="node-name" title="${esc(n.host)}">${esc(n.host)}</span>
        <span style="margin-left:auto" class="tag ${down ? "bad" : "ok"}">${down ? "不可用" : "可用"}</span>
      </div>
      <div class="node-ip mono">${esc(n.ip || "—")}</div>
      <div class="bar"><i class="${cls}" style="width:${Math.max(2, rate)}%"></i></div>
      <div class="node-row"><span>可用率</span><b>${rate}% <span style="color:var(--dim2);font-weight:400">· ${(n.ok || 0) + (n.fail || 0)} 次</span></b></div>
      <div class="node-row"><span>最近探测</span><b>${esc(n.last_result || "—")}</b></div>
      <div class="node-row"><span>${down ? "故障于" : "成功于"}</span><b>${fmtAgo(down ? n.last_fail : n.last_ok)}</b></div>
    `;
    box.appendChild(node);
  });
}

function renderEvents(events){
  const box = $("#events");
  if (!box) return;
  const MERGE = { readerr: 1, allfail: 1, config: 1, error: 1 };
  // 连续同类「故障」事件（15 分钟内）合并成一条，切换事件永远单独列
  const kept = [];
  events.slice().reverse().forEach((e) => {
    const prev = kept[kept.length - 1];
    if (prev && MERGE[e.type] && prev.type === e.type && Math.abs(prev.ts - e.ts) <= 900){
      prev._n = (prev._n || 1) + 1;
      return;
    }
    kept.push(Object.assign({}, e, { _n: 1 }));
  });
  if (!kept.length){ box.innerHTML = `<div class="empty" style="padding:18px">还没有切换或异常事件</div>`; return; }
  const shown = kept.slice(0, 8);
  box.innerHTML = "";
  shown.forEach((e) => {
    const div = el("div", "ev");
    const kind = e.type || "error";
    const raw = String(e.text || "").replace(/^(?:\[[A-Za-z]+\]\s*|[A-Z]+\s+)/, "");
    let text = (e.from && e.ip) ? `${e.from} → ${e.ip}` : raw;
    if (e._n > 1) text += `（连续 ${e._n} 次）`;
    div.innerHTML = `<time class="mono">${fmtTime(e.ts)}</time>
      <span class="k ${kind}">${esc(RESULT_TEXT[kind] || kind)}</span>
      <span class="t" title="${esc(raw)}">${esc(text)}</span>`;
    box.appendChild(div);
  });
  if (kept.length > shown.length){
    const more = el("div", "ev", `<time></time><span class="k"></span><span class="t" style="color:var(--dim2)">另有 ${kept.length - shown.length} 条较早事件，见下方日志</span>`);
    more.style.borderBottom = "0";
    box.appendChild(more);
  }
}

function renderConfig(cfg, inst){
  const box = $("#cfg");
  if (!box) return;
  const probe = cfg.probe || {}, beh = cfg.behaviour || {}, nf = cfg.notify || {};
  const rec = (cfg.records && cfg.records[0]) || {};
  const rows = [
    ["探测模式", `${probe.mode || "—"} / ${probe.port || "—"}`],
    ["超时", (probe.timeout || "—") + " s"],
    ["解析方式", probe.lookup || "system"],
    ["确认轮数", beh.confirm || "1"],
    ["TTL", String(beh.ttl || "—")],
    ["代理", beh.proxied === "1" ? "已代理" : beh.proxied === "0" ? "仅 DNS" : "不修改"],
    ["通知", nf.type || "none"],
    ["通知内容", nf.on_switch === "1" ? "切换+回切" : "仅切换"],
    ["记录", rec.name || "—"],
    ["节点数", String((cfg.nodes || []).length)],
  ];
  box.innerHTML = rows.map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><b title="${esc(v)}">${esc(v)}</b></div>`).join("");
  const p = $("#paths");
  if (p){
    p.innerHTML = `配置 <b>${esc(inst.config_path || "—")}</b><br>日志 <b>${esc(inst.log_path || "—")}</b>
      ${inst.state && inst.state._src ? "<br>状态 <b>" + esc(inst.state._src) + "</b>" : ""}`;
  }
}

function logMatches(line){
  if (S.logFilter === "all") return true;
  if (S.logFilter === "error") return line.level === "error" || line.level === "warn";
  return line.level !== "info" || /切换|回退|更新|不可用|候选|本轮结束|失败/.test(line.msg);
}

function renderLog(lines){
  const box = $("#log");
  if (!box) return;
  const list = lines.filter(logMatches).slice(-160).reverse();
  $("#logCnt").textContent = `${lines.length} 行 · 显示 ${list.length}`;
  box.innerHTML = list.map((l) => {
    const m = String(l.msg || "").replace(/^\[[A-Za-z]+\]\s*/, "");
    const lv = l.level || "info";
    const tag = { ok: "OK", warn: "WARN", error: "ERR", debug: "DBG", info: "INFO" }[lv] || "INFO";
    return `<div class="${lv}"><time class="mono">${fmtClock(l.ts)}</time><span class="lv ${lv}">${tag}</span><span class="m">${esc(m)}</span></div>`;
  }).join("") || `<div class="empty" style="padding:14px">没有日志</div>`;
}

function bindFilters(){
  document.querySelectorAll("[data-filter]").forEach((b) => {
    b.classList.toggle("on", b.dataset.filter === S.logFilter);
    b.onclick = () => {
      S.logFilter = b.dataset.filter;
      document.querySelectorAll("[data-filter]").forEach((x) => x.classList.toggle("on", x === b));
      renderLog(S.snap.log || []);
    };
  });
}

/* ====================================================================== */
/* 时间轴画布                                                              */
/* ====================================================================== */
function renderTimeline(){
  const cv = $("#tl");
  if (!cv) return;
  const s = S.snap;
  const rounds = s.rounds || [];
  const nodes = (s.nodes || []).filter((n) => n.host && !/^#/.test(n.host));
  const hostList = nodes.length ? nodes.map((n) => n.host) : uniqueHosts(rounds);

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const R = 12, T = 8, stripH = 4, stripGap = 9, laneH = 20, laneGap = 10;
  const lanes = Math.max(1, hostList.length);
  const maxLabel = hostList.reduce((m, h) => Math.max(m, shortHost(h).length), 3);
  const L = Math.min(150, Math.max(54, maxLabel * 7 + 14));
  const cssW = cv.clientWidth || 800;
  const lanesTop = T + stripH + stripGap;
  const lanesH = lanes * (laneH + laneGap) - laneGap;
  const cssH = Math.max(96, lanesTop + lanesH + 26);
  cv.style.height = cssH + "px";
  cv.width = Math.round(cssW * dpr);
  cv.height = Math.round(cssH * dpr);
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, cssW, cssH);

  const css = getComputedStyle(document.documentElement);
  const C = {
    ok: css.getPropertyValue("--ok").trim(),
    bad: css.getPropertyValue("--bad").trim(),
    warn: css.getPropertyValue("--warn").trim(),
    vio: css.getPropertyValue("--vio").trim(),
    dim2: css.getPropertyValue("--dim2").trim(),
    line: css.getPropertyValue("--line").trim(),
    txt: css.getPropertyValue("--txt").trim(),
  };

  const W = cssW - L - R;

  if (!rounds.length){
    g.fillStyle = C.dim2; g.font = "12px system-ui"; g.fillText("暂无探测记录", L, 30);
    $("#tlRange").textContent = "—";
    return;
  }

  const t0 = rounds[0].t, t1 = Math.max(rounds[rounds.length - 1].t, t0 + 60);
  const xOf = (t) => L + ((t - t0) / (t1 - t0)) * W;
  const step = W / Math.max(1, rounds.length - 1);
  const cw = Math.max(1.4, Math.min(9, step * 0.92));

  // 顶部状态条：每个轮次一格，颜色只标「异常/切换/确认中」
  const RES_COLOR = { pending: C.warn, switch: C.vio, failback: C.ok, allfail: C.bad,
                      readerr: C.bad, config: C.warn, error: C.bad, dryrun: C.dim2 };
  rounds.forEach((r) => {
    const color = RES_COLOR[r.r];
    if (!color) return;
    g.fillStyle = color;
    g.globalAlpha = .9;
    g.fillRect(xOf(r.t) - cw / 2, T, Math.max(1.6, cw), stripH);
    g.globalAlpha = 1;
  });

  // 车道标签
  g.font = "11px ui-monospace, monospace";
  hostList.forEach((h, i) => {
    const y = lanesTop + i * (laneH + laneGap) + laneH / 2 + 4;
    g.fillStyle = C.dim2;
    g.fillText(shortHost(h), 4, y);
  });

  // 每轮每节点上色
  rounds.forEach((r) => {
    const x = xOf(r.t) - cw / 2;
    hostList.forEach((h, i) => {
      const probe = (r.p || []).find((p) => p[0] === h);
      const y = lanesTop + i * (laneH + laneGap);
      if (!probe){
        g.fillStyle = C.line; g.globalAlpha = .55;
        g.fillRect(x, y + laneH / 2 - .5, cw, 1);
        g.globalAlpha = 1;
        return;
      }
      g.fillStyle = probe[1] ? C.ok : C.bad;
      g.globalAlpha = probe[1] ? .78 : .95;
      g.fillRect(x, y + 1, cw, laneH - 2);
      g.globalAlpha = 1;
    });
  });

  // 切换事件：贯穿竖线 + 顶部圆点
  rounds.forEach((r) => {
    if (r.r !== "switch" && r.r !== "failback") return;
    const x = xOf(r.t);
    const color = r.r === "failback" ? C.ok : C.vio;
    g.strokeStyle = color; g.globalAlpha = .75; g.lineWidth = 1;
    g.beginPath(); g.moveTo(x, T); g.lineTo(x, lanesTop + lanesH); g.stroke();
    g.globalAlpha = 1;
    g.fillStyle = color;
    g.beginPath(); g.arc(x, T + stripH / 2, 2.6, 0, Math.PI * 2); g.fill();
  });

  // 时间刻度
  const hours = (t1 - t0) / 3600;
  const tickEvery = hours > 36 ? 12 : hours > 12 ? 4 : hours > 4 ? 1 : 0.5;
  const baseY = lanesTop + lanesH;
  g.fillStyle = C.dim2; g.font = "10.5px ui-monospace, monospace";
  for (let h = 0; h <= hours; h += tickEvery){
    const t = t0 + h * 3600;
    const x = xOf(t);
    if (x > L - 2 && x < L + W + 2){
      g.strokeStyle = C.line; g.lineWidth = 1;
      g.beginPath(); g.moveTo(x, baseY + 3); g.lineTo(x, baseY + 7); g.stroke();
      const d = new Date(t * 1000);
      g.fillText(`${pad(d.getHours())}:00`, Math.min(x - 13, L + W - 26), baseY + 19);
    }
  }

  $("#tlRange").textContent = `${fmtTime(t0)} 起 · ${rounds.length} 轮`;

  // hover
  cv.onmousemove = (ev) => {
    const rect = cv.getBoundingClientRect();
    const x = ev.clientX - rect.left;
    if (x < L - 4 || x > L + W + 4){ hideTip(); return; }
    const ratio = (x - L) / W;
    const idx = Math.round(ratio * (rounds.length - 1));
    const r = rounds[Math.max(0, Math.min(rounds.length - 1, idx))];
    if (!r) return;
    const tip = $("#tlTip");
    const probes = (r.p || []).map((p) => `${p[0]} ${p[1] ? "✓" : "✗"} ${esc(p[2])}`).join("<br>");
    tip.innerHTML = `<b class="mono">${fmtTime(r.t)}</b><br>` +
      `<span style="color:var(--${RESULT_COLOR[r.r] || "dim"})">${RESULT_TEXT[r.r] || r.r}</span>` +
      (r.ip ? ` · <span class="mono">${esc(r.ip)}</span>` : "") +
      (r.c ? ` · 确认 ${esc(r.c)}` : "") +
      (probes ? `<br><span style="color:var(--dim2)">${probes}</span>` : "");
    tip.style.display = "block";
    const tw = tip.offsetWidth, left = Math.min(Math.max(8, x - tw / 2), cssW - tw - 8);
    tip.style.left = left + "px";
    tip.style.top = "-4px";
    tip.style.transform = "translateY(-100%)";
  };
  cv.onmouseleave = hideTip;
  function hideTip(){ const t = $("#tlTip"); if (t) t.style.display = "none"; }
}

function uniqueHosts(rounds){
  const set = new Set();
  rounds.forEach((r) => (r.p || []).forEach((p) => set.add(p[0])));
  return [...set];
}

function shortHost(h){
  const s = String(h || "");
  if (s.length <= 13) return s;
  const first = s.split(".")[0];
  return first.length <= 13 ? first : first.slice(0, 12) + "…";
}

/* ====================================================================== */
/* 立即检测                                                                */
/* ====================================================================== */
function openRun(){
  const s = S.snap || {};
  const inst = s.install || {};
  const canDry = inst.mode === "config";
  $("#runTitle").textContent = "立即检测";
  $("#runBody").innerHTML = `
    <div class="warnbox">这会执行一轮真实的检测：若当前节点不可用，脚本会改写 Cloudflare 记录。</div>
    <div class="hint">
      执行命令：<code class="mono">${esc(inst.mode === "config" ? "/usr/local/bin/cf-failover --config " + (inst.config_path || "") : "/bin/bash " + (inst.config_path || ""))}</code><br>
      执行身份：面板进程（需能读配置、写日志与状态文件，通常要求 root）。
    </div>
    <div class="out" id="runOut" style="display:none"></div>`;
  $("#runFoot").innerHTML = `
    <button class="ctl" id="runCancel">取消</button>
    ${canDry ? `<button class="ctl" id="runDry">试运行（不改 DNS）</button>` : ""}
    <button class="btn-primary" id="runGo">执行</button>`;
  $("#runMask").classList.add("on");
  $("#runCancel").onclick = closeRun;
  if (canDry) $("#runDry").onclick = () => doRun(true);
  $("#runGo").onclick = () => doRun(false);
}

function closeRun(){ $("#runMask").classList.remove("on"); }

async function doRun(dry){
  S.busy = true;
  const out = $("#runOut");
  const foot = $("#runFoot");
  out.style.display = "block";
  out.textContent = dry ? "正在试运行…" : "正在执行…";
  foot.querySelectorAll("button").forEach((b) => (b.disabled = true));
  try {
    const r = await fetch(BASE + "/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ dry: !!dry }),
    });
    const j = await r.json();
    if (j.error && !j.cmd){
      out.innerHTML = `<b style="color:var(--bad)">无法执行</b>\n${esc(j.error)}`;
    } else {
      const head = `<b>${esc(j.cmd || "")}</b>\n返回码 ${j.rc} · 耗时 ${j.dur}s\n\n`;
      out.innerHTML = head + esc((j.output || []).join("\n") || "(无输出)");
    }
    await fetchState(true);
  } catch (e) {
    out.innerHTML = `<b style="color:var(--bad)">请求失败</b>\n${esc(String(e))}`;
  } finally {
    S.busy = false;
    foot.querySelectorAll("button").forEach((b) => (b.disabled = false));
  }
}

/* ====================================================================== */
/* 交互                                                                    */
/* ====================================================================== */
function applyTheme(){
  document.documentElement.dataset.theme = S.theme;
  const b = $("#themeBtn");
  if (b) b.textContent = THEME_NAME[S.theme] || "配色";
}
function cycleTheme(){
  const i = THEMES.indexOf(S.theme);
  S.theme = THEMES[(i + 1) % THEMES.length];
  localStorage.setItem("cfdash.theme", S.theme);
  applyTheme();
  if (S.snap) renderTimeline();
}

function init(){
  applyTheme();
  const sel = $("#refresh");
  sel.value = String(S.refresh);
  sel.onchange = () => {
    S.refresh = Number(sel.value);
    localStorage.setItem("cfdash.refresh", String(S.refresh));
    schedule();
  };
  $("#themeBtn").onclick = cycleTheme;
  $("#runBtn").onclick = openRun;
  $("#runMask").onclick = (e) => { if (e.target.id === "runMask") closeRun(); };
  window.addEventListener("resize", () => { if (S.snap) renderTimeline(); });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) fetchState(true); });

  fetchState(true);
  schedule();
}

init();
</script>
